<style>
:root {
  --red:#e30613; --deep:#9f0012; --ink:#2d2d2d; --muted:#5c6670;
  --line:#ef4760; --bg:#fff; --max:1500px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
main{width:min(var(--max),calc(100% - 36px));margin:0 auto;padding:0 0 34px}
.hero{width:100%;overflow:hidden;border-radius:0 0 5px 5px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hero img{display:block;width:100%;height:auto}
.section-title{font-size:28px;font-weight:700;margin:42px 0 24px;letter-spacing:-.4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{position:relative;display:block;overflow:hidden;background:#fff;border:1px solid #e5e5e5;border-radius:3px;box-shadow:0 1px 5px rgba(0,0,0,.10);text-decoration:none;transition:transform .16s ease,box-shadow .16s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.15)}
.card:focus-visible{outline:3px solid #0b72ce;outline-offset:3px}
.card img{display:block;width:100%;height:auto;aspect-ratio:1.06/1;object-fit:contain;background:#fff}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(90deg,#ff0014,#e30613,#ff0014)}
.go{position:absolute;z-index:2;right:50%;bottom:0;transform:translate(50%,2px);width:27px;height:27px;border-radius:50%;background:#fff;color:var(--red);font-size:27px;line-height:24px;text-align:center;font-weight:700}
.footer{margin-top:44px;overflow:hidden;border-radius:4px;background:linear-gradient(155deg,#fff 0 32%,#f1f3f5 32% 38%,#b40013 38% 61%,#e30613 61% 67%,#fff 67%);min-height:125px;position:relative}
.footer::before{content:"";position:absolute;inset:auto -5% -35px -5%;height:90px;background:linear-gradient(7deg,#78000d 0 46%,#e30613 47% 60%,transparent 61%);transform:skewX(-12deg)}
.footer-content{position:relative;z-index:2;padding:35px 46px;color:#fff;display:flex;align-items:center;gap:30px}
.footer-title{font-size:22px;font-weight:700;letter-spacing:.5px}
.footer-sub{font-size:14px;opacity:.92}
@media (max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){main{width:min(100% - 20px,var(--max))}.section-title{font-size:22px;margin-top:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.footer-content{padding:28px 24px;display:block}}
@media (max-width:460px){.grid{grid-template-columns:1fr}.card img{aspect-ratio:1.15/1}}
</style>
